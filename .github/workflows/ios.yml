name: Build unsigned iOS app

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Select an available iPhone simulator
        run: |
          xcrun simctl list devices available -j > /tmp/devices.json
          DEVICE_ID=$(python3 - <<'PY'
          import json
          data = json.load(open('/tmp/devices.json'))
          phones = [d for runtime, devices in data['devices'].items()
                    if 'iOS' in runtime for d in devices if d['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No available iPhone simulator')
          print(phones[0]['udid'])
          PY
          )
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Run catalog tests
        run: |
          xcodebuild test -project OpenStore.xcodeproj -scheme OpenStore \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build/simulator -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Capture native app screenshot
        run: |
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE_ID" build/simulator/Build/Products/Debug-iphonesimulator/OpenStore.app
          xcrun simctl launch "$DEVICE_ID" com.example.openstore
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot build/OpenStore.png
      - name: Build unsigned device app
        run: bash scripts/build-unsigned.sh
      - name: Upload unsigned IPA and screenshot
        uses: actions/upload-artifact@v4
        with:
          name: OpenStore-unsigned
          path: |
            build/OpenStore-unsigned.ipa
            build/OpenStore.png
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenStore-test-results
          path: build/TestResults.xcresult
          if-no-files-found: ignore
